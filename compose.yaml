x-authentik: &authentik
  build: .
  image: ${RECIPE_IMAGE:-authentik-oidc-broker-local:1.0.0}
  shm_size: 512mb
  init: false
  restart: "no"
  stop_grace_period: 35s
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-common-env: &common-env
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__PORT: "5432"
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  AUTHENTIK_POSTGRESQL__SSLMODE: disable
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY}
  AUTHENTIK_OUTPOSTS__DISCOVER: "false"
  AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST: "true"
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
  AUTHENTIK_LISTEN__HTTPS: 127.0.0.1:9443
  AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 127.0.0.0/8
  RECIPE_BOOTSTRAP_TIMEOUT: "600"

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 2s
      timeout: 3s
      retries: 60
  worker:
    <<: *authentik
    command: ["worker"]
    environment:
      <<: *common-env
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.invalid}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?Set AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?Set AUTHENTIK_BOOTSTRAP_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
  server:
    <<: *authentik
    command: ["server"]
    environment: *common-env
    ports: ["127.0.0.1:18423:9000"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  database:
